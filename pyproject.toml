[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primal-space-cli"
version = "0.1.0"
description = "Primal Space CLI for Android/Termux device discovery, heartbeat, and safe compute"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mahithpaulin" }]
dependencies = []

[project.scripts]
primal = "primal.cli:main"

[tool.setuptools.packages.find]
include = ["primal*"]
