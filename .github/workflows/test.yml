name: Run tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install --no-build-isolation .
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile sources
        run: python -m compileall -q primal
